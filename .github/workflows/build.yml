# Builds the Windows installer and publishes it as a GitHub Release.
# Run it from the repository's Actions tab: "Build installer" -> Run workflow,
# type the new version number (e.g. 0.2.0). Installed copies of Cabinet CAM
# pick the release up as an update (the repository has to be public for that).
name: Build installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for this release (e.g. 0.2.0) - must be higher than the last one"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set the version
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # where to publish (this repository's Releases) is in package.json -> build.publish
      - name: Build and publish the installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
